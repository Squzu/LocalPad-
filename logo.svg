<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <title>LocalPad++ mascot "Pad-chan"</title>
  <defs>
    <clipPath id="badge"><rect width="512" height="512" rx="116"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a36"/><stop offset="1" stop-color="#12161d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#00a3e0" stop-opacity=".45"/><stop offset="1" stop-color="#00a3e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5bd0"/><stop offset=".55" stop-color="#2b3a8f"/><stop offset="1" stop-color="#1a2260"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a8f"/><stop offset=".7" stop-color="#2a63c9"/><stop offset="1" stop-color="#2ac3de"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3d78"/><stop offset=".55" stop-color="#1b86d8"/><stop offset="1" stop-color="#7fe6ff"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeadf"/><stop offset="1" stop-color="#ffd6c4"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <g id="star"><path d="M0-1 .28-.28 1 0 .28.28 0 1-.28.28-1 0-.28-.28Z"/></g>
    <g id="plus"><path d="M-5-17h10v12h12v10h-12v12h-10v-12h-12v-10h12z"/></g>
    <g id="eye">
      <ellipse cx="0" cy="0" rx="28" ry="36" fill="#0b1a33"/>
      <ellipse cx="0" cy="2" rx="25" ry="33" fill="url(#iris)"/>
      <ellipse cx="0" cy="-2" rx="12" ry="18" fill="#0b1a33"/>
      <circle cx="-9" cy="-14" r="9" fill="#fff"/>
      <circle cx="10" cy="14" r="4.5" fill="#fff" opacity=".9"/>
      <circle cx="4" cy="-4" r="2.2" fill="#fff" opacity=".8"/>
    </g>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- faint code lines in the background -->
    <g opacity=".22" stroke-linecap="round" stroke-width="9">
      <path d="M40 70h70" stroke="#7aa2f7"/><path d="M122 70h46" stroke="#a5d6a7"/>
      <path d="M58 92h96" stroke="#bb9af7"/><path d="M58 114h40" stroke="#ffb454"/><path d="M108 114h58" stroke="#2ac3de"/>
      <path d="M380 70h58" stroke="#f7768e"/><path d="M350 92h90" stroke="#7aa2f7"/><path d="M372 114h66" stroke="#a5d6a7"/>
      <path d="M36 440h80" stroke="#2ac3de"/><path d="M36 462h54" stroke="#ffb454"/>
      <path d="M392 440h84" stroke="#bb9af7"/><path d="M420 462h56" stroke="#7aa2f7"/>
    </g>
    <circle cx="256" cy="262" r="205" fill="none" stroke="#00a3e0" stroke-opacity=".25" stroke-width="3" stroke-dasharray="3 14" stroke-linecap="round"/>

    <!-- twin tails -->
    <g id="tailL">
      <path d="M160 250C108 270 70 330 82 418C92 450 112 462 126 440C138 410 134 380 150 350C170 320 178 290 176 262Z" fill="url(#tail)"/>
      <path d="M124 330C112 360 108 395 112 425" stroke="#7aa2f7" stroke-opacity=".5" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <use href="#tailL" transform="translate(512 0) scale(-1 1)"/>
    <!-- back hair -->
    <ellipse cx="256" cy="232" rx="148" ry="140" fill="url(#hair)"/>

    <!-- hoodie -->
    <path d="M150 512C150 430 190 372 256 372C322 372 362 430 362 512Z" fill="#2f6fd0"/>
    <path d="M214 376C226 410 286 410 298 376C282 372 270 370 256 370C242 370 230 372 214 376Z" fill="#245aa8"/>
    <path d="M232 400v52M280 400v52" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="232" cy="456" r="6" fill="#fff"/><circle cx="280" cy="456" r="6" fill="#fff"/>
    <!-- ++ on the hoodie -->
    <g fill="#fff" opacity=".92" transform="translate(212 490) scale(.55)"><use href="#plus"/></g>
    <g fill="#fff" opacity=".92" transform="translate(262 490) scale(.55)"><use href="#plus"/></g>
    <!-- neck -->
    <path d="M234 340h44v40c-14 14-30 14-44 0z" fill="#f4c7b3"/>

    <!-- face -->
    <ellipse cx="256" cy="262" rx="112" ry="102" fill="url(#skin)"/>
    <!-- ears -->
    <ellipse cx="146" cy="276" rx="9" ry="16" fill="#ffd6c4"/><ellipse cx="366" cy="276" rx="9" ry="16" fill="#ffd6c4"/>

    <!-- eyes -->
    <use href="#eye" transform="translate(204 288)"/>
    <use href="#eye" transform="translate(308 288)"/>
    <!-- lids / lashes -->
    <path d="M172 276C182 252 218 246 236 266" stroke="#12161d" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M174 274L162 282" stroke="#12161d" stroke-width="6" stroke-linecap="round"/>
    <path d="M340 276C330 252 294 246 276 266" stroke="#12161d" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M338 274L350 282" stroke="#12161d" stroke-width="6" stroke-linecap="round"/>
    <!-- brows -->
    <path d="M184 238Q204 228 226 236" stroke="#2b3a8f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M328 238Q308 228 286 236" stroke="#2b3a8f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- blush, nose, mouth -->
    <ellipse cx="170" cy="330" rx="22" ry="10" fill="#ff7fa1" opacity=".55"/>
    <ellipse cx="342" cy="330" rx="22" ry="10" fill="#ff7fa1" opacity=".55"/>
    <path d="M168 326h10M178 326l-4 8M188 326l-4 8" stroke="#ff4f7c" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round" fill="none" transform="translate(-2 -2)"/>
    <path d="M254 312l4 4" stroke="#e0a290" stroke-width="3" stroke-linecap="round"/>
    <path d="M238 330Q247 344 256 332Q265 344 274 330" stroke="#c0505a" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- front hair (bangs) -->
    <path d="M136 262C120 160 176 100 256 98C336 100 392 160 376 262C368 226 356 204 340 190C324 214 298 214 282 192C270 218 244 218 232 192C216 214 190 214 172 190C156 204 144 226 136 262Z" fill="url(#hair)"/>
    <path d="M232 192C240 150 262 124 292 112" stroke="#7aa2f7" stroke-opacity=".55" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M172 190C170 160 190 130 214 116" stroke="#7aa2f7" stroke-opacity=".4" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- side locks -->
    <path d="M142 250C132 296 140 338 160 362C158 322 166 286 176 250Z" fill="url(#hair)"/>
    <path d="M370 250C380 296 372 338 352 362C354 322 346 286 336 250Z" fill="url(#hair)"/>
    <!-- ahoge -->
    <path d="M250 104C236 70 252 48 280 44C268 58 270 80 276 100Z" fill="#2b3a8f"/>

    <!-- ++ hair clips -->
    <g filter="url(#soft)" fill="#00a3e0" opacity=".8"><g transform="translate(176 150) scale(1.1)"><use href="#plus"/></g></g>
    <g fill="#00a3e0" stroke="#e8f8ff" stroke-width="2.5" stroke-linejoin="round" transform="translate(176 150) scale(1.1)"><use href="#plus"/></g>
    <g fill="#00a3e0" stroke="#e8f8ff" stroke-width="2.5" stroke-linejoin="round" transform="translate(206 128) scale(.6)"><use href="#plus"/></g>

    <!-- sparkles -->
    <g fill="#e8f8ff"><use href="#star" transform="translate(92 150) scale(16)"/><use href="#star" transform="translate(430 190) scale(20)"/><use href="#star" transform="translate(412 90) scale(11)"/><use href="#star" transform="translate(84 330) scale(9)"/></g>
    <g fill="#00a3e0"><use href="#star" transform="translate(448 330) scale(10)"/><use href="#star" transform="translate(118 96) scale(8)"/></g>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#00a3e0" stroke-width="6"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
